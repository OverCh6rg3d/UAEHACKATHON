<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DABAB ATC Panel</title>
<style>
  :root{--bg:#0b0f14;--panel:#151c25;--panel2:#1b2430;--line:#2b3644;--text:#f2f5f8;--dim:#8d9aab;--amber:#ffb020;--green:#2fd27a;--red:#ff5a5a;--blue:#5aa9ff;}
  *{box-sizing:border-box;margin:0}
  body{background:var(--bg);color:var(--text);font:14px/1.35 Arial,Helvetica,Tahoma,sans-serif;min-width:1180px;transform-origin:0 0}
  html{overflow-x:hidden;overflow-y:auto}
  button,select{font:inherit;color:inherit}
  h2{font-size:12px;letter-spacing:.8px;color:var(--dim);text-transform:uppercase;font-weight:700;margin-bottom:8px}
  .tag{font-size:11px;padding:1px 6px;border-radius:4px;border:1px solid var(--line);color:var(--dim);white-space:nowrap}
  .tag.real{border-color:#2d6b4a;color:var(--green)}
  .tag.sim{border-color:#6b5320;color:var(--amber)}
  .tag.bad{border-color:#7a3030;color:var(--red)}

  header{display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--panel);border-bottom:2px solid var(--line)}
  header .logo{font-size:22px;font-weight:700;letter-spacing:1px}
  header .logo span{color:var(--amber)}
  header .sub{color:var(--dim)}
  header .sp{flex:1}
  header .clock{font-size:20px;font-weight:700;direction:ltr}
  .hbtn{height:34px;padding:0 12px;border-radius:6px;border:2px solid var(--line);background:var(--bg);font-weight:700;cursor:pointer}
  .hbtn.tab.on{border-color:var(--blue);background:#12263d;color:#cfe5ff}
  .flights{margin-top:12px}

  .alert{display:flex;align-items:stretch;gap:10px;padding:10px 16px;background:#2a2210;border-bottom:2px solid #6b5320}
  .alert .ttl{display:flex;flex-direction:column;justify-content:center;min-width:230px}
  .alert .ttl b{font-size:22px;color:var(--amber)}
  .kpi{flex:1;background:var(--bg);border:1px solid #6b5320;border-radius:8px;padding:6px 12px}
  .kpi small{display:block;color:var(--dim);font-size:12px}
  .kpi b{font-size:22px;direction:ltr;display:inline-block}
  .kpi em{font-style:normal;color:var(--dim);font-size:13px}

  main{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:12px;padding:12px 16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px}
  .col{display:flex;flex-direction:column;gap:12px;min-width:0}
  .hrow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
  .hrow h2{margin:0}

  svg text{fill:var(--dim);font:11px Arial}
  .legend{display:flex;gap:12px;font-size:12px;color:var(--dim);margin-top:4px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-inline-end:4px}

  table{width:100%;border-collapse:collapse}
  th{font-size:11px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;text-align:start;padding:6px 8px;border-bottom:1px solid var(--line);font-weight:700}
  td{padding:7px 8px;border-bottom:1px solid #1f2935;white-space:nowrap}
  tr:last-child td{border-bottom:0}
  .yes{color:var(--green);font-weight:700}.nope{color:var(--red);font-weight:700}
  .num{direction:ltr;unicode-bidi:isolate}

  .floor li{list-style:none;padding:3px 0}
  .floor li::before{content:"\2713";color:var(--green);font-weight:700;margin-inline-end:8px}

  .profiles{display:flex;gap:8px;flex-wrap:wrap}
  .chip{padding:9px 14px;border-radius:20px;border:2px solid var(--line);background:var(--bg);cursor:pointer;font-weight:700}
  .chip.on{border-color:var(--blue);background:#12263d;color:#cfe5ff}

  .plans{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .plan{background:var(--panel2);border:3px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;text-align:start;display:flex;flex-direction:column;gap:6px}
  .plan.sel{border-color:var(--amber)}
  .plan.rej{opacity:.4}
  .plan .ph{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .plan .k{width:32px;height:32px;border-radius:50%;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex:none}
  .plan .nm{font-size:16px;font-weight:700;flex:1}
  .plan .rec{font-size:11px;font-weight:700;color:#04210f;background:var(--green);padding:2px 6px;border-radius:4px}
  .plan,.plan .k,.plan .nm,.plan .mt{transition:all .25s ease}
  .plan .pw{display:none;color:var(--dim);font-size:14px;border-top:1px solid var(--line);padding-top:10px;margin-top:4px}
  .plans.big .plan{padding:16px;gap:10px}
  .plans.big .plan:hover{border-color:#5b6b80}
  .plans.big .k{width:48px;height:48px;font-size:24px}
  .plans.big .nm{font-size:21px}
  .plans.big .mt{font-size:16px;row-gap:9px}
  .plans.big .pw{display:block}
  .hint{color:var(--dim);font-size:14px;margin-top:10px;text-align:center}
  .plan.rej{cursor:not-allowed}
  .allrej{display:flex;align-items:center;gap:14px;margin-top:12px;padding:12px 14px;border-radius:8px;background:#2a1414;border:2px solid #7a3030}
  .allrej div{flex:1}
  .allrej b{display:block;color:var(--red);font-size:17px;margin-bottom:2px}
  .allrej .btn{flex:0 0 220px;height:48px;font-size:16px}
  #exCard{animation:pop .25s ease}
  @keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .mt{display:grid;grid-template-columns:1fr auto;row-gap:3px;font-size:13px}
  .mt span{color:var(--dim)}
  .mt b{text-align:end}
  .best{color:var(--green)}

  .explain{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:14px}
  .explain h3{font-size:18px;margin-bottom:6px}
  .explain p{margin-bottom:6px}
  .explain .lbl{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
  .conf{text-align:center;border-inline-start:1px solid var(--line);padding-inline-start:14px}
  .conf b{display:block;font-size:34px;color:var(--green)}
  .cbar{height:8px;background:var(--bg);border-radius:4px;overflow:hidden;margin-top:4px}
  .cbar i{display:block;height:100%;background:var(--green)}
  .acts{display:flex;gap:10px;margin-top:10px}
  .btn{flex:1;height:52px;border-radius:8px;border:0;font-weight:700;font-size:18px;cursor:pointer}
  .approve{background:var(--green);color:#04210f;flex:2}
  .modify{background:var(--panel2);border:2px solid var(--blue);color:#cfe5ff}
  .modify.on{background:#12263d}
  .reject{background:var(--panel2);border:2px solid var(--red);color:#ffc9c9}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .banner{margin-top:10px;padding:8px 10px;border-radius:6px;font-weight:700}
  .banner.ok{background:#12301f;border:1px solid #2d6b4a;color:var(--green)}
  .banner.mod{background:#12263d;border:1px solid #2c5a8f;color:#cfe5ff;font-weight:400}
  .steps{display:flex;gap:6px;margin-top:8px}
  .step{flex:1;border:2px solid var(--line);border-radius:6px;padding:7px 6px;font-size:13px;color:var(--dim);text-align:center}
  .step.on{border-color:var(--green);color:var(--text)}
  .step.on::before{content:"\2713  ";color:var(--green);font-weight:700}

  .log{max-height:230px;overflow:auto;font-size:13px}
  .log div{padding:6px 0;border-bottom:1px solid #1f2935}
  .log div:last-child{border:0}
  .log time{color:var(--dim);margin-inline-end:6px;direction:ltr;unicode-bidi:isolate}
  .log .a{font-weight:700}
  .empty{color:var(--dim)}

  .flights{margin:0 16px 12px}
  .act-h{color:var(--amber);font-weight:700}
  .act-d{color:var(--blue);font-weight:700}
  .fm{display:inline-block;width:60px;height:8px;background:var(--bg);border:1px solid var(--line);border-radius:3px;vertical-align:middle;margin-inline-end:6px;overflow:hidden}
  .fm i{display:block;height:100%;background:var(--green)}
  .fm i.low{background:var(--amber)}
  td select{background:var(--bg);border:2px solid var(--blue);border-radius:6px;padding:4px 6px}
  td select:disabled{border-color:var(--line);opacity:.6}
  footer{padding:0 16px 16px;color:var(--dim);font-size:12px}
  .compact td{padding:4px 8px}.compact th{padding:4px 8px}
  .ai{display:block}
  .ai .lbl{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
  .tl{display:flex;gap:4px;align-items:stretch}
  .tl div{flex:1;border-radius:6px;padding:6px 4px;text-align:center;font-size:12px;font-weight:700;border:2px solid var(--line)}
  .tl small{display:block;font-weight:400;color:var(--dim);font-size:12px;direction:ltr}
  .tl .c{border-color:#2d6b4a;color:var(--green)}.tl .w{border-color:#8a6a1e;color:var(--amber)}
  .tl .n{border-color:#a0521e;color:#ff8a3d}.tl .f{border-color:#7a3030;color:var(--red);background:#2a1414}
  .imp{display:flex;gap:8px}
  .imp div{flex:1;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center}
  .imp b{display:block;font-size:22px;color:var(--green);direction:ltr}.imp b.bad{color:var(--amber)}
  .imp small{color:var(--dim);font-size:12px}
  .profrow{display:flex;align-items:center;gap:12px;padding:8px 12px}.profrow h2{margin:0;max-width:140px;font-size:11px;line-height:1.25}.profrow .profiles{flex-wrap:nowrap}.profrow .chip{padding:7px 12px;white-space:nowrap}
  .tlk{flex:2.2}.tlk>small{display:block;color:var(--dim);font-size:12px;margin-bottom:3px}.tlk .tl div{padding:2px 4px}
  .ai{padding:8px 12px}.ai .lbl{margin-bottom:4px}.tl div{padding:4px}.imp div{padding:4px 8px}
  footer{font-size:11px!important;padding:0 16px 8px!important;line-height:1.3}
  #scatter{max-height:165px}
  .compact table{font-size:12.5px}.compact td,.compact th{padding:3px 6px}
  .log{max-height:70px!important}
  .plans.big .plan{padding:12px;gap:8px}.plans.big .mt{row-gap:6px}.plans.big .k{width:40px;height:40px;font-size:21px}
  .alert{padding:8px 16px}.card{padding:10px 12px}main{gap:10px;padding:10px 16px}.col{gap:10px}
  /* wide screens (16:9 and wider): the right column splits into two, so the page is shorter and scales up */
  body.wide main{grid-template-columns:minmax(0,1fr) 640px}
  body.wide main>.col:last-child{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"imp feed" "net feed" "net log";grid-template-rows:auto auto 1fr;align-content:stretch}
  body.wide .c-imp{grid-area:imp}body.wide .c-feed{grid-area:feed}body.wide .c-net{grid-area:net}body.wide .c-log{grid-area:log}
  .c-log{display:flex;flex-direction:column;min-height:0}.c-log .log{height:190px;max-height:190px!important;overflow-y:auto}
  body.wide .c-log{align-self:start}body.wide .c-log .log{height:150px;max-height:150px!important}
  main>.col:last-child{align-self:stretch}
  .csub{color:var(--dim);font-size:12px;margin-top:6px;line-height:1.3}
  .c-net,.c-imp{align-self:start;flex:none}   /* never stretch: no empty box under the tables */
  .c-feed{align-self:start;flex:none}
  body:not(.wide) .feed{height:105px}body:not(.wide) .c-log .log{height:110px;max-height:110px!important}
  .feed{height:190px;overflow-y:auto;font-size:12.5px;direction:ltr;font-family:Consolas,Menlo,monospace}
  .feed div{display:grid;grid-template-columns:44px 38px 58px 1fr;gap:6px;padding:3px 0;border-bottom:1px solid #1f2935}
  .feed .tm{color:var(--dim)}.feed .ap{font-weight:700}.feed .vs{text-align:end}
  .feed .mt{color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:11.5px}
  .feed .s-WATCH .vs{color:var(--amber)}.feed .s-WARNING .vs{color:#ff8a3d}.feed .s-ALERT .vs{color:var(--red);font-weight:700}
  .feed .s-ALERT{background:#2a1414}
  .live{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-inline-end:6px;animation:blink 1.2s infinite}
  @keyframes blink{50%{opacity:.25}}
  .hide{display:none}
</style>
</head>
<body>

<header>
  <div class="logo">DABAB <span>&#1590;&#1576;&#1575;&#1576;</span></div>
  <div class="sub" data-t="sub"></div>
  <span class="tag sim" data-t="replay"></span>
  <button class="hbtn tab" id="tabMain" data-t="tabMain"></button>
  <button class="hbtn tab" id="tabFl" data-t="tabFl"></button>
  <div class="sp"></div>
  <div class="clock" id="clock"></div>
  <button class="hbtn" id="reset" data-t="reset"></button>
  <button class="hbtn" id="lang"></button>
</header>

<section class="alert">
  <div class="ttl"><b data-t="alertT"></b><span data-t="alertS"></span></div>
  <div class="kpi"><small data-t="k1"></small><b>193 m</b></div>
  <div class="kpi" id="kWin"><small data-t="k2"></small><b>07:04 &ndash; 08:30</b></div>
  <div class="kpi"><small data-t="k3"></small><b>15</b> <em data-t="k3b"></em></div>
  <div class="kpi" id="kArr"><small data-t="k4"></small><b>50</b> <em data-t="k4b"></em></div>
  <div class="kpi tlk hide" id="tlBox"></div>
</section>

<main id="main">
  <!-- CENTRE -->
  <div class="col">
    <div class="card profrow">
      <h2 data-t="hProf"></h2>
      <div class="profiles" id="profiles"></div>
    </div>
    <div class="card">
      <div class="hrow"><h2 data-t="hPlans"></h2><span class="tag sim" data-t="illus"></span></div>
      <div class="plans" id="plans"></div>
      <div class="hint" id="hint" data-t="hint"></div>
      <div class="allrej hide" id="allRej">
        <div><b data-t="arT"></b><span data-t="arS"></span></div>
        <button class="btn modify" id="newPlans" data-t="arBtn"></button>
      </div>
    </div>
    <div class="card" id="exCard">
      <div class="explain">
        <div>
          <h3 id="exT"></h3>
          <div class="lbl" data-t="why"></div><p id="exWhy"></p>
          <div class="lbl" data-t="cost"></div><p id="exCost"></p>
          <div class="lbl" data-t="whyNot"></div><p id="exNot"></p>
        </div>
        <div class="conf"><div class="lbl" data-t="conf"></div><b id="exConf" class="num"></b><div class="cbar"><i id="exBar"></i></div><div class="csub" id="exConfSub"></div></div>
      </div>
      <div class="banner mod hide" id="modB"></div>
      <div class="acts">
        <button class="btn approve" id="approve"></button>
        <button class="btn modify" id="modify" data-t="modify"></button>
        <button class="btn reject" id="reject" data-t="reject"></button>
      </div>
      <div class="banner ok hide" id="okB"></div>
      <div class="steps hide" id="steps"><div class="step" data-t="s1"></div><div class="step" data-t="s2"></div><div class="step" data-t="s3"></div><div class="step" data-t="s4"></div></div>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="col">
    <div class="card ai hide c-imp" id="aiStrip"></div>
    <div class="card compact c-net">
      <div class="hrow"><h2 data-t="hNet"></h2><span class="tag real" data-t="real"></span></div>
      <table id="net"></table>
    </div>
    <div class="card c-feed hide" id="feedCard">
      <div class="hrow"><h2><span class="live"></span><span id="feedT">Live weather feed · METAR</span></h2><span class="tag real" data-t="real"></span></div>
      <div class="feed" id="feed"></div>
    </div>
    <div class="card c-log">
      <div class="hrow"><h2 data-t="hLog"></h2></div>
      <div class="log" id="log"></div>
    </div>
  </div>
</main>

<section class="card flights hide" id="flPage">
  <div class="hrow"><h2><span data-t="hFl"></span> &middot; <span id="flPlan"></span></h2><span><span class="tag real" data-t="flReal"></span> <span class="tag sim" data-t="flSim"></span></span></div>
  <div class="banner mod hide" id="modB2" style="margin:0 0 10px"></div>
  <div style="margin-bottom:10px"><button class="hbtn" id="flBack" style="height:44px;font-size:16px;border-color:var(--blue);color:#cfe5ff"></button></div>
  <table id="fl"></table>
</section>

<footer data-t="foot"></footer>

function scatter(){if(!$('scatter'))return;
  var w=310,h=200,l=34,b=30,top=10,r=12;
  // axes follow the data: nice round steps around the three plans and D
  var xs=[DOM.delay,PLANS.A.delay,PLANS.B.delay,PLANS.C.delay],ys=[DOM.risk,PLANS.A.risk,PLANS.B.risk,PLANS.C.risk];
  var rng=function(v){var lo=Math.min.apply(0,v),hi=Math.max.apply(0,v),st=hi-lo>12?10:(hi-lo>5?5:2);return [Math.floor((lo-st/2)/st)*st,Math.ceil((hi+st/2)/st)*st,st]};
  var xr=rng(xs),yr=rng(ys),x0=xr[0],x1=xr[1],y0=yr[0],y1=yr[1],ticks=function(a,b2,st){var o=[];for(var v=a;v<=b2+1e-9;v+=st)o.push(v);return o};
  var X=function(v){return l+(w-l-r)*(v-x0)/(x1-x0)},Y=function(v){return h-b-(h-b-top)*(v-y0)/(y1-y0)},s='';
  ticks(y0,y1,yr[2]).forEach(function(v){s+='<line x1="'+l+'" x2="'+(w-r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="#2b3644"/><text x="'+(l-5)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  ticks(x0,x1,xr[2]).forEach(function(v){s+='<text x="'+X(v)+'" y="'+(h-b+13)+'" text-anchor="middle">'+v+'</text>'});
  s+='<text x="'+((l+w-r)/2)+'" y="'+(h-2)+'" text-anchor="middle">'+tx('xAx')+'</text>';
  s+='<text transform="translate(9,'+((h-b+top)/2)+') rotate(-90)" text-anchor="middle">'+tx('yAx')+'</text>';
  s+='<circle cx="'+X(DOM.delay)+'" cy="'+Y(DOM.risk)+'" r="11" fill="none" stroke="#5b6b80" stroke-dasharray="3 3"/><text x="'+X(DOM.delay)+'" y="'+(Y(DOM.risk)+4)+'" text-anchor="middle">D</text>';
  ['A','B','C'].forEach(function(p){var d=PLANS[p],on=p===sel,rc=p===PROF[prof];
    s+='<g data-p="'+p+'" style="cursor:pointer"><circle cx="'+X(d.delay)+'" cy="'+Y(d.risk)+'" r="'+(on?15:12)+'" fill="'+(rc?'#2fd27a':'#2b3644')+'" stroke="'+(on?'#ffb020':'#0b0f14')+'" stroke-width="3"/><text x="'+X(d.delay)+'" y="'+(Y(d.risk)+5)+'" text-anchor="middle" style="fill:'+(rc?'#04210f':'#f2f5f8')+';font-weight:700;font-size:14px">'+p+'</text></g>'});
  $('scatter').innerHTML=s;

  $('plans').querySelectorAll('.plan').forEach(function(c){c.onclick=function(){pick(c.dataset.p)}});
  $('plans').classList.toggle('big',!sel);

  $('allRej').classList.toggle('hide',!allRejected());

  // network

  $('exNot').textContent=['A','B','C'].filter(function(p){return p!==sel}).map(function(p){return t['not'+p]}).join('  ');

    function strip(){
      var en=lang==='en',pid=sel||PROF[prof],r=PLANS[pid],d=DOM,el=$('aiStrip');el.classList.remove('hide');  // follows the selected plan, else the recommended one
      var pct=function(a,b){return b?Math.round(100*(a-b)/b):0};
      var cell=function(v,lab,bad){return '<div><b class="'+(bad?'bad':'')+'">'+(v>0?'+':'')+v+'%</b><small>'+lab+'</small></div>'};
      var m={delay:[r.delay,d.delay,en?'avg delay':'متوسط التأخير'],fuel:[r.fuel,d.fuel,en?'holding + diversion fuel':'وقود الانتظار والتحويل'],
             div:[r.div,d.div,en?'diversions':'التحويلات'],conn:[r.conn,d.conn,en?'connections at risk':'ربط معرّض للخطر']}[prof];
      var a=[pct(m[0],m[1]),pct(r.fuel,d.fuel),pct(r.risk,d.risk)];
      var lab2=[m[2],en?'fuel':'الوقود',en?'risk index':'مؤشر المخاطر'];
      if(prof==='fuel'){a=[a[0],pct(r.delay,d.delay),a[2]];lab2[1]=en?'avg delay':'متوسط التأخير';}
      var A=LIVE.alert,lead=A.watch_lead_min,h=Math.floor(lead/60),mi=lead%60;
      var tl=$('tlBox');tl.classList.remove('hide');$('kWin').classList.add('hide');$('kArr').classList.add('hide');
      tl.innerHTML='<small>'+(en?'AI fog model · '+h+' h '+mi+' min warning':'نموذج الضباب الذكي · إنذار قبل '+h+' س '+mi+' د')+'</small>'+
        '<div class="tl"><div class="c">'+(en?'CLEAR':'صافٍ')+'</div><div class="w">'+(en?'WATCH':'ترقّب')+'<small>'+A.watch+'</small></div>'+
        '<div class="n">'+(en?'WARNING':'تحذير')+'<small>'+A.warning+'</small></div><div class="f">'+(en?'FOG':'ضباب')+'<small>'+A.fog+'</small></div></div>';
      el.innerHTML='<div class="lbl">'+(en?'Plan '+pid+(pid===PROF[prof]?' (recommended)':'')+' vs no coordination':'الخطة '+pid+(pid===PROF[prof]?' (موصى بها)':'')+' مقابل عدم التنسيق')+'</div>'+
        '<div class="imp">'+a.map(function(v,i){return cell(v,lab2[i],v>0)}).join('')+'</div>';
    }
    PLANS=LIVE.plans[prof][SET];acts=PLANS[PROF[prof]].acts.slice();render();
    // chips: keep the flight actions in step with the newly chosen profile
    var chipFix=function(){$('profiles').querySelectorAll('.chip').forEach(function(c){var h=c.onclick;c.onclick=function(){h();if(!sel){PLANS=LIVE.plans[prof][SET];acts=PLANS[PROF[prof]].acts.slice();render()}}})};
    (function feed(){
      var F=D.feed||[];if(!F.length)return;$('feedCard').classList.remove('hide');
      var box=$('feed'),i=0,stop='07:12';
      function row(r){var el=document.createElement('div');el.className='s-'+(r.state||'CLEAR');
        el.innerHTML='<span class="tm">'+r.time+'</span><span class="ap">'+r.airport+'</span><span class="vs">'+
          (r.vis===null?'—':(r.vis>=9999?'10 km+':r.vis+' m'))+'</span><span class="mt">'+r.metar+'</span>';
        box.insertBefore(el,box.firstChild)}
      (function tick(){if(i<F.length&&F[i].time<=stop){row(F[i++]);setTimeout(tick,180)}})();
      $('feedT').textContent=lang==='en'?'Live weather feed · METAR':'بث الطقس المباشر · METAR';
      if(window.dababFit)setTimeout(window.dababFit,50);
    })();
    var np=$('newPlans').onclick,rs=$('reset').onclick;
    $('newPlans').onclick=function(){SET=1-SET;setRec();PLANS=LIVE.plans[prof][SET];np();acts=PLANS[PROF[prof]].acts.slice();render()};
    $('reset').onclick=function(){SET=0;setRec();PLANS=LIVE.plans[prof][SET];rs();acts=PLANS[PROF[prof]].acts.slice();render()};
    var ap=$('approve').onclick,rj=$('reject').onclick;
    $('approve').onclick=function(){var p=sel,m=acts.slice();ap();post({kind:'approve',plan:p,profile:prof,acts:m,modifications:mods()})};
    $('reject').onclick=function(){var p=sel;rj();post({kind:'reject',plan:p,profile:prof})};
  }).catch(function(){/* backend not running: illustrative data stays */});
})();
/* ---------- presentation fit: scale the whole page to fill the screen ----------
   Finds the largest zoom at which the page, laid out across the full window width,
   fits the window height in its TALLEST state: a plan selected with the longest
   explanation, the approval banner and the dispatch steps showing. After every
   change it re-checks and shrinks if needed. Scrolling is never disabled, so
   nothing can be trapped off-screen. */
(function(){
  var DW=1240,Z=1,busy=false;
  function worstNot(){                                   // longest real 'why not' paragraph
    if(PLANS.A&&PLANS.A.not){var w='';['A','B','C'].forEach(function(p){var v=PLANS[p].not[lang].join('  ');if(v.length>w.length)w=v});return w}
    return longest('not')+'  '+longest('not')}
  function longest(prefix){var best='';['A','B','C'].forEach(function(p){var v=String(T[lang][prefix+p]||'');if(v.length>best.length)best=v});return best}
  function measure(w){
    // save classes of the containers and only the TEXT of plain text elements:
    // never re-write the plan buttons, or their click handlers are lost
    var b=document.body,ids=['exCard','plans','hint','okB','steps','modB','exWhy','exCost','exNot'],
        txt={okB:1,exWhy:1,exCost:1,exNot:1},keep={};
    ids.forEach(function(id){var e=$(id);keep[id]=[e.className,txt[id]?e.textContent:null]});
    b.style.zoom=1;b.style.width=w+'px';
    $('exCard').classList.add('hide');$('plans').classList.add('big');
    var h1=b.scrollHeight;                                                     // overview
    $('exCard').classList.remove('hide');$('plans').classList.remove('big');$('hint').classList.add('hide');
    ['okB','steps'].forEach(function(id){$(id).classList.remove('hide')});  // approved state
    $('modB').classList.add('hide');                     // replaced by the approval banner
    if(!$('okB').textContent)$('okB').textContent='Plan A approved at 07:12:00. Instructions sent after human confirmation.';
    $('exWhy').textContent=longest('why');$('exCost').textContent=longest('cost');
    $('exNot').textContent=worstNot();
    var h2=b.scrollHeight;                                                     // worst case
    ids.forEach(function(id){var e=$(id);e.className=keep[id][0];if(keep[id][1]!==null)e.textContent=keep[id][1]});
    return Math.max(h1,h2);
  }
  function fit(){
    if(busy)return;busy=true;
    var b=document.body;
    try{
      if(page!=='main'){var zf=Math.min(innerWidth/DW,1.3);b.style.zoom=zf;b.style.width=Math.floor(innerWidth/zf)+'px';Z=zf;return}
      b.classList.toggle('wide',innerWidth/innerHeight>1.7);
      var lo=0.5,hi=Math.min(1.8,innerWidth/1100);         // never narrower than 1100 px of layout
      for(var k=0;k<10;k++){var z=(lo+hi)/2;if(measure(Math.floor(innerWidth/z))*z<=innerHeight-6)lo=z;else hi=z}
      Z=lo;b.style.width=Math.floor(innerWidth/Z)+'px';b.style.zoom=Z;
    }finally{busy=false}
  }
  function guard(){                                         // safety net after every change
    if(page==='main'&&document.body.scrollHeight*Z>innerHeight+2)fit();
  }
  var last=page,_r=render;render=function(){_r();
    if(page!==last){last=page;fit()}else guard()};
  var rt;addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(fit,120)});
  window.dababFit=fit;
  setTimeout(fit,300);setTimeout(fit,1500);                 // after fonts and live data arrive
})();
</script>
